# À chaque envoi sur main : publie le dossier public/ sur GitHub Pages
#   https://thoms33.github.io/metro-duel/
# Le duel passe par une liaison directe entre joueurs (public/p2p.js) : un site statique suffit.
# À faire une fois : Settings → Pages → Source « GitHub Actions ».
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deploiement
        uses: actions/deploy-pages@v5
